name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json engines: node >=22.5, imposed by the built-in
          # node:sqlite module that src/storage/db.ts imports at runtime.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite is fully mocked — no LM Studio, no network, no secrets.
      # test/phase37/mutex.test.ts is the only timing-sensitive file and runs
      # with fileParallelism: false (vitest.config.ts).
      - name: Test
        run: npm test

      # The packaging shape is load-bearing: the plugin's .mcp.json launches
      # ${CLAUDE_PLUGIN_ROOT}/dist/index.js, and that binary is produced by the
      # build. A packaging break that typecheck cannot see is the failure mode
      # a consumer actually hits, so build it here rather than discovering it
      # at install time.
      - name: Build
        run: npm run build

      - name: Verify the plugin bundle is self-contained
        run: |
          test -f plugin/nanites/dist/index.js
          test -f plugin/nanites/package.json
          test -f plugin/nanites/package-lock.json
          # A marketplace install gives the plugin its own node_modules rather
          # than resolving upward into the repo, so prove the runtime deps
          # actually install and import from the plugin root alone.
          (cd plugin/nanites && npm ci --ignore-scripts --no-audit --no-fund)
          (cd plugin/nanites && echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | timeout 25 node dist/index.js)
